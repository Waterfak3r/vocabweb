services:
  vacabweb:
    build:
      context: .
    image: ${VACABWEB_IMAGE:-vacabweb:latest}
    restart: unless-stopped
    expose:
      - "3000"
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    stop_grace_period: 15s
    volumes:
      - vacab-data:/app/backend/data
    environment:
      TRUST_PROXY: "1"
      FRONTEND_ORIGIN: "${FRONTEND_ORIGIN:-}"
      REGISTRATION_ENABLED: "${REGISTRATION_ENABLED:-true}"
      MAX_WORDBOOKS_PER_CLIENT: "${MAX_WORDBOOKS_PER_CLIENT:-50}"
      MAX_WORDS_PER_CLIENT: "${MAX_WORDS_PER_CLIENT:-50000}"
      MAX_DRAFTS_PER_CLIENT: "${MAX_DRAFTS_PER_CLIENT:-20}"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: 768m
    cpus: 1.5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - backend

  caddy:
    image: caddy:2.11.4-alpine
    restart: unless-stopped
    depends_on:
      vacabweb:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_ADDRESS: "${SITE_ADDRESS:-http://localhost}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 256m
    cpus: 0.5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - edge
      - backend

volumes:
  vacab-data:
  caddy-data:
  caddy-config:

networks:
  edge:
  backend:
    internal: true
