services:
  vacabweb:
    build:
      context: .
    image: vacabweb:latest
    ports:
      - "3000:3000"
    restart: unless-stopped
    volumes:
      # Persist SQLite accounts, sessions, catalog, wordbooks, and study events.
      - vacab-data:/app/backend/data
    environment:
      # The image already sets NODE_ENV=production, PORT=3000 and
      # STATIC_DIR=/app/frontend/dist. Uncomment/adjust as needed:
      #
      # Number of reverse proxies in front of the app (0 = none). Required for
      # correct per-IP rate limiting when running behind nginx / a load balancer.
      # - TRUST_PROXY=1
      #
      # Extra browser origins allowed by CORS, comma-separated. Same-origin
      # requests (served frontend) need no entry here.
      # - FRONTEND_ORIGIN=https://vocab.example.com
      #
      # Override the SQLite path (relative to /app/backend). Keep it inside the
      # mounted volume so data survives container recreation.
      # - DATABASE_FILE=./data/study-state.sqlite
      #
      # Optional legacy JSON source imported once when the SQLite database is empty.
      # - DATA_FILE=./data/study-state.json

volumes:
  vacab-data:
