name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: ${{ matrix.package }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [backend, frontend]
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.package }}/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: npm test
      - if: matrix.package == 'frontend'
        run: npm run build

  docker:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t vacabweb:ci .
      - name: Container readiness smoke test
        run: |
          docker run -d --name vacabweb-ci -p 127.0.0.1:3000:3000 -e REGISTRATION_ENABLED=false vacabweb:ci
          trap 'docker logs vacabweb-ci; docker rm -f vacabweb-ci' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/api/health/ready; then
              exit 0
            fi
            sleep 1
          done
          exit 1

  browser:
    name: account and community browser flow
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            frontend/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm ci --prefix backend
      - run: npm audit --omit=dev --audit-level=high --prefix backend
      - run: npm ci --prefix frontend
      - run: npm audit --omit=dev --audit-level=high --prefix frontend
      - run: npm run build
      - run: npm run test:e2e:community-account
